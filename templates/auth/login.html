{% extends 'landing.html' %}

{% block content %}
<div class="flex-grow flex items-center justify-center py-16 mt-20 px-4">
    <!-- Window Frame -->
    <div
        class="win-frame shadow-brutal-lg max-w-md w-full relative z-10 transform sm:hover:-translate-y-1 transition-transform">

        <!-- Window Title Bar -->
        <div class="win-title bg-retro-blue text-retro-border">
            <span>LOGIN.exe</span>
            <div class="flex space-x-1">
                <div class="w-3 h-3 bg-white border border-retro-border"></div>
                <div class="w-3 h-3 bg-white border border-retro-border"></div>
                <div class="w-3 h-3 bg-retro-pink border border-retro-border flex items-center justify-center">
                    <i class="ri-close-line text-[8px] text-retro-border"></i>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="p-8 bg-white">
            <div class="text-center mb-8">
                <div
                    class="inline-block bg-retro-yellow border-2 border-retro-border w-16 h-16 shadow-brutal-sm mb-4 transform -rotate-3 flex items-center justify-center">
                    <i class="ri-user-smile-fill text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold font-['Space_Grotesk'] tracking-tight">Welcome Back!</h2>
                <p class="text-gray-600 font-medium px-4 mt-2">Enter your credentials to resume your saved game.</p>
            </div>

            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                <div
                    class="bg-{% if message.tags == 'error' %}red-100 border-red-300 text-red-700{% else %}green-100 border-green-300 text-green-700{% endif %} border-2 p-3 text-sm font-bold flex items-center shadow-brutal-sm">
                    <i
                        class="{% if message.tags == 'error' %}ri-error-warning-fill{% else %}ri-checkbox-circle-fill{% endif %} mr-2 text-lg"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="space-y-5">
                    <!-- Username Field -->
                    <div>
                        <label for="username"
                            class="block text-sm font-bold text-gray-900 mb-2 uppercase tracking-wide">Player ID <span
                                class="text-red-500">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ri-user-line text-gray-500 font-bold"></i>
                            </div>
                            <input type="text" name="username" id="username" required
                                class="w-full bg-[#fdf6e3] border-2 border-retro-border text-gray-900 pl-10 pr-4 py-3 font-semibold focus:outline-none focus:ring-4 focus:ring-retro-blue focus:bg-white transition-colors shadow-[2px_2px_0_0_#1a1a1a]"
                                placeholder="Enter your username">
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="password"
                                class="block text-sm font-bold text-gray-900 uppercase tracking-wide">Passcode <span
                                    class="text-red-500">*</span></label>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ri-lock-password-line text-gray-500 font-bold"></i>
                            </div>
                            <input type="password" name="password" id="password" required
                                class="w-full bg-[#fdf6e3] border-2 border-retro-border text-gray-900 pl-10 pr-4 py-3 font-semibold focus:outline-none focus:ring-4 focus:ring-retro-pink focus:bg-white transition-colors shadow-[2px_2px_0_0_#1a1a1a]"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="brutal-btn brutal-btn-pink w-full py-4 mt-6 text-lg flex items-center justify-center font-bold tracking-widest relative overflow-hidden group">
                        <span class="relative z-10">PRESS START</span>
                        <i
                            class="ri-arrow-right-line ml-2 relative z-10 group-hover:translate-x-1 transition-transform"></i>
                        <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity">
                        </div>
                    </button>
                </div>
            </form>

            <!-- Bottom Link -->
            <div class="mt-8 text-center pt-6 border-t-2 border-dashed border-gray-300">
                <p class="text-sm font-bold text-gray-600">
                    New player?
                    <a href="{% url 'register' %}"
                        class="bg-retro-yellow px-2 py-1 border-2 border-transparent hover:border-retro-border text-retro-border transition-colors">Create
                        Character</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Decorative Accents -->
    <div class="fixed top-32 left-8 w-24 h-24 bg-retro-yellow border-3 border-retro-border -z-10 shadow-brutal animate-bounce hidden lg:block"
        style="animation-duration: 3s;"></div>
    <div
        class="fixed bottom-20 right-12 w-32 h-32 bg-retro-blue border-3 border-retro-border rounded-full -z-10 shadow-brutal hidden lg:block">
    </div>
    <div
        class="fixed top-1/2 right-32 w-16 h-16 bg-white border-3 border-retro-border -z-10 shadow-brutal transform rotate-45 hidden lg:block">
    </div>
</div>

<!-- Extra styles for auth pages overriding hero layout -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Hide the main hero content, show this instead if it's rendered inside landing
        const main = document.querySelector('main > div:first-child');
        if (main && !main.classList.contains('auth-page-marker')) {
            main.style.display = 'none';
        }
        document.querySelector('main').classList.add('auth-page-marker');
    });
</script>
{% endblock %}
